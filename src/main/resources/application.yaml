spring:
  application:
    name: cashback-rewards
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cashback_rewards}
    username: ${DB_USERNAME:cashback}
    password: ${DB_PASSWORD:cashback}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that the mappings match.
      ddl-auto: validate
  flyway:
    enabled: true
